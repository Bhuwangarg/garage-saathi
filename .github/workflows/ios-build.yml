# Builds and signs the iOS app on an Apple-silicon runner.
#
# Why this exists: the only Mac on this project is a 2019 Intel i9, and Xcode
# 16.4 is the last version Apple ever shipped for x86_64. Its device support
# stops at iOS 16.4, so it physically cannot deploy to an iOS 26 iPhone. GitHub's
# macOS runners are Apple silicon with current Xcode, so they can.
#
# Manual trigger only — macOS runner minutes bill at 10x, so this should not fire
# on every push.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload to TestFlight (needs a PAID Developer Program account)"
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: mobile/ios/App/App.xcodeproj
  SCHEME: App
  TEAM_ID: 6MBZV2AKF7
  BUNDLE_ID: com.mahalaxmi.garagesaathi

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Fail now with a readable message rather than 20 minutes deep in xcodebuild.
      - name: Check required secrets
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see .github/workflows/README-ios.md"
            exit 1
          fi

      # Pin to the newest Xcode on the image rather than whatever is selected.
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] || latest=/Applications/Xcode.app
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # build-www.mjs copies the PWA from the repo root into mobile/www, then
      # `cap sync` pushes it into the native project. Without this the app bundles
      # a stale copy of the web app.
      - name: Build web assets and sync into the native project
        working-directory: mobile
        run: npm run sync

      # An App Store Connect API key lets xcodebuild create and download signing
      # assets itself (-allowProvisioningUpdates), so there are no .p12 or
      # .mobileprovision blobs to juggle. The key needs the App Manager role.
      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          # altool looks here specifically; xcodebuild takes an explicit path.
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      # TestFlight rejects a build number it has already seen, so derive a
      # monotonic one from the run number instead of the pbxproj's hardcoded 1.
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarageSaathi-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      # Distribution to a physical iPhone goes through TestFlight, which requires
      # the paid Developer Program. A free personal team can build and sign the
      # IPA above, but cannot distribute it.
      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # The archive is where crash-report symbolication comes from; keep it when
      # a build is actually shipped.
      - name: Upload dSYMs
        if: ${{ inputs.upload_to_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: dSYMs-${{ github.run_number }}
          path: ${{ runner.temp }}/App.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30
