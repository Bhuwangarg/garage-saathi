# Builds an installable Android APK.
#
# Unlike the iOS workflow this needs no Apple account, no signing secrets and no
# paid membership — a debug APK is signed with the auto-generated debug keystore
# and sideloads onto any device with "install from unknown sources" enabled.
#
# Runs on ubuntu, which is free for public repos, so it's cheap enough to fire on
# every push to main as well as on demand.
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only rebuild when something that ends up in the APK actually changes.
      - "app.js"
      - "index.html"
      - "styles.css"
      - "db.js"
      - "sync.js"
      - "seed-data.js"
      - "seed-docs.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "vendor/**"
      - "mobile/**"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      # build-www.mjs copies the PWA from the repo root into mobile/www, then
      # `cap sync` pushes it into the native project. Without this the APK ships
      # a stale copy of the web app.
      - name: Build web assets and sync into the native project
        working-directory: mobile
        run: npm run sync

      # Guard against the failure mode that is invisible until someone installs
      # the APK: a green build that silently packaged the wrong web bundle.
      - name: Verify the synced bundle
        run: |
          pub=mobile/android/app/src/main/assets/public

          # Copied byte-for-byte, so any difference means a stale sync.
          # app.js is NOT in this list any more: the CDN URLs moved out of
          # index.html into loadMapLib()/loadFaceLib(), so build-www.mjs now
          # rewrites app.js too and it is expected to differ. It is checked
          # below by what the rewrite must have done, which is the stronger
          # assertion anyway — equality only ever proved the file was copied.
          for f in styles.css db.js sync.js seed-data.js seed-docs.js; do
            if ! diff -q "$f" "$pub/$f" >/dev/null; then
              echo "::error::$f in the APK differs from the repo copy — cap sync did not take"
              exit 1
            fi
          done

          # index.html and app.js are deliberately rewritten for native: CDN URLs
          # are swapped for vendored copies so the map and face detection work
          # offline, the native bridge shim is injected, and the service worker is
          # disabled (it would shadow the Capacitor scheme). Assert the rewrite
          # happened rather than that a file matches — equality would mean
          # build-www.mjs silently did nothing.
          fail=0
          grep -q 'native-bridge-shim.js'        "$pub/index.html" || { echo "::error::native bridge shim missing"; fail=1; }
          grep -q 'isNativePlatform'             "$pub/index.html" || { echo "::error::service worker not disabled for native"; fail=1; }
          grep -q 'vendor/leaflet.js'            "$pub/app.js"     || { echo "::error::leaflet not vendored into app.js"; fail=1; }
          grep -q 'vendor/face-api.js'           "$pub/app.js"     || { echo "::error::face-api not vendored into app.js"; fail=1; }
          # A packaged app must never reach for a CDN: it is expected to work in
          # a workshop with no signal.
          for f in index.html app.js; do
            grep -q 'unpkg.com/leaflet\|cdn.jsdelivr.net/npm/@vladmandic/face-api/dist' "$pub/$f" \
              && { echo "::error::a CDN URL survived in $f — the app would need the network to render"; fail=1; }
          done
          # app.js must still be the current build in every other respect.
          if ! diff <(sed -e 's#vendor/leaflet.css#https://unpkg.com/leaflet@1.9.4/dist/leaflet.css#g' \
                          -e 's#vendor/leaflet.js#https://unpkg.com/leaflet@1.9.4/dist/leaflet.js#g' \
                          -e 's#vendor/face-api.js#https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js#g' \
                          "$pub/app.js") app.js >/dev/null; then
            echo "::error::app.js in the APK differs from the repo copy beyond the CDN rewrite — cap sync did not take"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1

          echo "web bundle is current and the native rewrite is intact"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Report APK details
        id: apk
        run: |
          apk=$(find mobile/android -name "*-debug.apk" | head -1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          {
            echo "### Android build ${{ github.run_number }}"
            echo ""
            echo "- size: $(du -h "$apk" | cut -f1)"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- install: \`adb install -r <downloaded>.apk\`, or open the file on the phone"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarageSaathi-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
