<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garage Saathi — Backup</title>
<!--
  Standalone backup page. Deliberately NOT part of the app bundle:

  - It must run when the app is broken, so it shares no code with app.js and
    registers no service worker.
  - It is on the same origin as the PWA, which is the only reason it can read
    the same IndexedDB. Opening it from a file:// path or another domain reads
    a DIFFERENT, empty database — the counts below are the guard against that.
  - It opens the database WITHOUT a version number, so it can never trigger an
    upgrade and never writes. Read-only by construction.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 48px;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1720; color: #e8eef5;
  }
  @media (prefers-color-scheme: light) { body { background: #f6f8fa; color: #16202b; } }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .65; font-size: 14px; margin-bottom: 20px; }
  .card {
    background: rgba(127,127,127,.10); border: 1px solid rgba(127,127,127,.22);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 5px 0; border-bottom: 1px solid rgba(127,127,127,.16); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  .zero td { opacity: .4; font-weight: 400; }
  .total { font-size: 17px; font-weight: 800; margin-top: 10px; }
  button {
    width: 100%; padding: 16px; font-size: 17px; font-weight: 700;
    border: 0; border-radius: 12px; background: #2f7df6; color: #fff;
    cursor: pointer; margin-top: 6px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .warn { background: rgba(239,68,68,.14); border-color: rgba(239,68,68,.5); }
  .ok   { background: rgba(22,165,113,.14); border-color: rgba(22,165,113,.5); }
  code { font-size: 13px; opacity: .8; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚌 Garage Saathi — Backup</h1>
  <div class="sub">Reads this device's data and saves it as one file. Nothing is uploaded, changed or deleted.</div>

  <div id="origin" class="card"><code></code></div>
  <div id="status" class="card">Reading this device…</div>
  <div id="counts" class="card" hidden><table id="tbl"></table><div class="total" id="total"></div></div>

  <button id="dl" disabled>Save backup file</button>
</div>

<script>
// Store list mirrors db.js. Kept as a literal rather than imported so this page
// still works if the app bundle is broken — the whole point of a rescue tool.
var STORES = ['users','buses','parts','jobcards','ledger','attendance','purchases',
  'drivers','incidents','driverreports','routes','triplog','fuel','gpsevents',
  'audits','components','def','vendors','trips','challans','meta'];

var $ = function (s) { return document.querySelector(s); };
$('#origin').querySelector('code').textContent = location.origin + location.pathname;

// No version argument: attach to whatever version exists. Passing a number could
// trigger onupgradeneeded and write to the database we are trying to rescue.
function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open('garage-saathi');
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
    req.onblocked = function () { reject(new Error('database blocked — close the Garage Saathi app tab and reload')); };
  });
}

function readStore(db, name) {
  return new Promise(function (resolve) {
    if (!db.objectStoreNames.contains(name)) return resolve([]);
    var out = [];
    var req = db.transaction(name, 'readonly').objectStore(name).openCursor();
    req.onsuccess = function (e) {
      var cur = e.target.result;
      if (!cur) return resolve(out);
      out.push(cur.value);
      cur.continue();
    };
    // A single unreadable store must not lose the other twenty.
    req.onerror = function () { resolve(out); };
  });
}

var payload = null;

openDB().then(function (db) {
  return Promise.all(STORES.map(function (s) { return readStore(db, s); }))
    .then(function (results) {
      var data = {}, total = 0, rows = '';
      STORES.forEach(function (name, i) {
        data[name] = results[i];
        total += results[i].length;
        rows += '<tr class="' + (results[i].length ? '' : 'zero') + '"><td>' + name +
                '</td><td>' + results[i].length + '</td></tr>';
      });
      $('#tbl').innerHTML = rows;
      $('#total').textContent = total.toLocaleString() + ' records';
      $('#counts').hidden = false;

      payload = {
        app: 'garage-saathi',
        kind: 'device-backup',
        version: db.version,
        origin: location.origin,
        exportedAt: new Date().toISOString(),
        userAgent: navigator.userAgent,
        counts: STORES.reduce(function (a, s) { a[s] = data[s].length; return a; }, {}),
        data: data
      };

      var st = $('#status');
      if (!total) {
        st.className = 'card warn';
        st.innerHTML = '<b>No data on this device.</b><br>' +
          'Either this is not the phone that holds the garage data, or it was opened ' +
          'from a different address than the app. Open the app, confirm the buses are ' +
          'there, then return to this page from the same address.';
        return;
      }
      st.className = 'card ok';
      st.innerHTML = '<b>Found ' + total.toLocaleString() + ' records.</b><br>' +
        'Check the numbers below look right, then save the file and send it somewhere safe.';
      $('#dl').disabled = false;
    });
}).catch(function (err) {
  var st = $('#status');
  st.className = 'card warn';
  st.textContent = 'Could not read the database: ' + (err && err.message ? err.message : err);
});

$('#dl').onclick = function () {
  if (!payload) return;
  var stamp = payload.exportedAt.replace(/[:.]/g, '-').slice(0, 19);
  var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'garage-saathi-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  $('#dl').textContent = 'Saved ✓  (tap again for another copy)';
};
</script>
</body>
</html>
