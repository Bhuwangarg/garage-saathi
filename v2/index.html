<!doctype html>
<!-- `data-v2`, `data-density` and (when the person picks one) `data-theme` all sit
     on THIS element. tokens.css requires it: its dark guard is
     `[data-v2]:not([data-theme="light"])`, which only ever sees `data-theme`
     where `data-v2` is, so the two on different elements is a light theme that
     cannot be turned on. `data-density` ships as `yard` because yard is the safe
     failure — a 64px row on a desk is roomy, a 32px row in a yard is unusable —
     and boot.js corrects it from the machine's own answer before first paint. -->
<html lang="en" data-v2 data-density="yard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Every relative URL below -- 32 of them, plus the worker registration at the
     foot -- resolves against THIS, not against wherever the document happens to
     be served. Without it, serving this file at "/" for the cutover resolves
     `db.js` to v1's db.js and `ui/tokens.css` to v1's: the same names exist in
     both, so the app would come up as v2's markup running v1's data layer,
     silently, while `boot.js` and `caps.js` 404. One line here instead of 32
     absolute paths, and the precache list in sw.js stays the same list in the
     same shape, which is what test_v2_boot.js compares.

     Safe because v2 reads nothing from the URL: no hash, no pushState, no
     location.pathname outside the worker. The document's address is not state. -->
<base href="/v2/">
<title>Garage Saathi</title>
<!-- The v2 app root. No styles.css: v2 has its own design system under ui/ and
     reaches outside /v2/ for nothing (the isolation gate checks that). -->
<link rel="stylesheet" href="ui/tokens.css">
<link rel="stylesheet" href="ui/components.css">
<link rel="stylesheet" href="ui/screens.css">
<link rel="stylesheet" href="ui/shell.css">
<link rel="stylesheet" href="ui/today.css">
<link rel="stylesheet" href="ui/attention.css">
<link rel="stylesheet" href="ui/work.css">
<link rel="stylesheet" href="ui/duty.css">
<link rel="stylesheet" href="ui/gate.css">
<link rel="stylesheet" href="ui/buses.css">
<link rel="stylesheet" href="ui/fuel.css">
<link rel="stylesheet" href="ui/money.css">
<link rel="stylesheet" href="ui/people.css">
<link rel="stylesheet" href="ui/reviews.css">
<link rel="stylesheet" href="ui/store.css">
<link rel="stylesheet" href="ui/me.css">
<link rel="stylesheet" href="ui/login.css">
</head>
<body>
<noscript>This app needs JavaScript.</noscript>
<div id="app"></div>

<!-- ===================================================================== -->
<!-- THE SCRIPT ORDER, AND WHY IT IS AN ORDER                               -->
<!--                                                                        -->
<!-- These are classic scripts declaring top-level `const`s. They are not    -->
<!-- modules, there is no import graph, and nothing here is deferred: the    -->
<!-- parser runs them in exactly this sequence, and a file placed above      -->
<!-- something it needs is one console error and a blank page. So the order  -->
<!-- is a dependency order and not a preference, and it is declared as data  -->
<!-- in test_v2_boot.js (ORDER and DEPS) so that reordering two lines here   -->
<!-- turns a check red instead of turning a screen white.                    -->
<!--                                                                        -->
<!-- Every module resolves its neighbours at CALL time rather than capturing -->
<!-- them at load (see v2/night.js's db(), v2/router.js's caps()), which is  -->
<!-- what keeps a single mistake here recoverable rather than fatal. That is -->
<!-- a reason to keep the order honest, not a reason to stop caring about    -->
<!-- it: boot.js runs at the bottom of this document and calls into all of   -->
<!-- them, and by then every one of them has to have declared itself.        -->
<!--                                                                        -->
<!-- This list and sw.js's precache list are THE SAME LIST. A file served    -->
<!-- here but not precached there works perfectly until the yard goes        -->
<!-- offline at 20:00, and nothing else in the repo would notice; one slice  -->
<!-- owns both files and test_v2_boot.js compares them entry for entry.      -->
<!--                                                                        -->
<!-- Not yet on disk, and each goes in at the position its dependencies say  -->
<!-- (add it HERE and in sw.js, or the check that compares the two lists     -->
<!-- against the directory goes red, which is the point of it):              -->
<!--   ui/shell.css  with the other stylesheets, any order                    -->
<!--   shell.js      after cache.js, before the screens                      -->
<!--   screens/*.js  after shell.js, before boot.js, any order between them: -->
<!--                 each registers itself with Router at load and draws      -->
<!--                 nothing until Shell.mount asks                          -->
<!-- ===================================================================== -->

<!-- icon()/ICONS first: states.js, overlay.js, photos.js and the nav all build
     markup around an icon, and nothing builds an icon. words.js next, because
     every one of them puts a word in that markup. -->
<script src="ui/icons.js"></script>
<script src="ui/words.js"></script>
<script src="ui/states.js"></script>
<script src="ui/overlay.js"></script>
<script src="ui/photos.js"></script>
<!-- The gate-pass sheets: markup around an icon and a word, with a photo
     capture cell in it, handed to V2.openSheet — so they follow all four.
     Reached from the Job card and from a piece on Fuel & tyres, which is why
     they are a ui/ file and not part of either screen. `Outside` is resolved
     at call time, so outside.js may load after this. -->
<script src="ui/passes.js"></script>
<script src="ui/nav.js"></script>

<!-- The data layer. db.js declares DB; sync.js, pullapply.js and night.js all
     read it. -->
<script src="db.js"></script>
<script src="sync.js"></script>
<script src="pullapply.js"></script>
<script src="night.js"></script>

<!-- Pure formatters, no dependents among the three, so any order between them. -->
<script src="fmt.js"></script>
<script src="odo.js"></script>
<script src="cost.js"></script>
<!-- outside.js is pure like the three above it: rows and `now` go in, a number
     or a boolean comes out. The away days, the close gate, the pass number and
     the 14-day threshold, each one expression in one place. -->
<script src="outside.js"></script>

<!-- caps.js is the capability table; router.js enforces it; cache.js reads the
     stores; boot.js is last and is the only script that calls anything. -->
<script src="caps.js"></script>
<script src="router.js"></script>
<script src="cache.js"></script>
<script src="shell.js"></script>
<!-- The login, beside the frame and not in screens/: it is reached holding no
     capability at all, so it can never be in Caps.SCREENS, and the checks that
     compare v2/screens/ against that table would be at odds with a file there. -->
<script src="login.js"></script>
<script src="screens/attention.js"></script>
<script src="screens/buses.js"></script>
<script src="screens/duty.js"></script>
<script src="screens/fuel.js"></script>
<script src="screens/gate.js"></script>
<script src="screens/jobcard.js"></script>
<script src="screens/jobs.js"></script>
<script src="screens/me.js"></script>
<script src="screens/money.js"></script>
<script src="screens/people.js"></script>
<script src="screens/reviews.js"></script>
<script src="screens/store.js"></script>
<script src="screens/today.js"></script>
<script src="boot.js"></script>

<script>
  /* 'sw.js' resolves against the <base> above, so this is always /v2/sw.js --
   * v2's own worker and never v1's, wherever this document is served from.
   *
   * The scope is the cutover. While v2 was a second app the browser capped this
   * worker at /v2/ and that cap, being the browser's rule rather than ours, was
   * the thing that made it safe to build beside a live app. v2 is the app now:
   * it answers "/", and a worker that cannot control "/" cannot make "/" work
   * offline, which is the whole premise of this thing in a yard with no signal.
   * The widening is granted by Service-Worker-Allowed, sent by the server for
   * this file alone, and check-v2-isolation.sh asserts BOTH halves are present
   * and narrow once V2_AT_ROOT is set -- and that neither exists while it is not. */
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: '/' }).catch(() => {});
    });
  }
</script>
</body>
</html>
