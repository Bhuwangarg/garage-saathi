<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Garage Saathi</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Leaflet (live map). Cross-origin → loads when online; map degrades gracefully offline. -->
  <!-- Leaflet is fetched on demand by loadMapLib(), only when a map screen opens.
       It was previously downloaded and parsed on every page load for the large
       majority of sessions that never open a map. -->
  <!-- face-api.js — face detection for attendance check-in/out (fallback when the
       browser has no native FaceDetector). Online only; attendance degrades to a
       plain selfie offline. -->
  <!-- face-api is fetched on demand by loadFaceLib(), only when a face capture
       actually starts, and only where the browser has no native FaceDetector. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <!-- seed-data.js is 541 KB of bundled fleet data used ONLY the first time a
       device is seeded. It was being downloaded, parsed and held in memory on
       every single load, for every device that had long since been seeded.
       loadSeedData() now fetches it only when there is seeding left to do. -->
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // When a new worker takes control, reload once so the fresh app + data apply
      // without the user having to clear anything.
      let _reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_reloaded) return; _reloaded = true; location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update();                              // force an update check on every open
          setInterval(() => reg.update(), 3600000);  // and hourly while open
        }).catch(() => {});
      });

      /* The worker now serves the cached shell first and refreshes it behind
       * the page, so a load can be running the previous build while the new one
       * sits in the cache. It says so when that happens, and we pick a moment.
       *
       * The moment matters more than the speed. A reload that lands mid job
       * card is the data-loss bug this app already fixed once, so this waits
       * for a screen nobody is working on: no sheet, no focused field, nothing
       * typed, and fifteen seconds since the last touch. If that moment never
       * comes, nothing is lost — the cache is already updated, so the next
       * ordinary open runs the new code. Reloading is the bonus, not the
       * mechanism. */
      let _updatePending = false;
      let _lastTouch = Date.now();
      ['pointerdown', 'keydown', 'input', 'focusin'].forEach(function (ev) {
        window.addEventListener(ev, function () { _lastTouch = Date.now(); }, true);
      });
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'shell-updated') return;
        _updatePending = true;
      });
      /* Listening alone loses a race: the worker revalidates as soon as it has
       * served app.js, which on a quick connection is before this page has
       * finished parsing it. So we ask too, shortly after load and then
       * occasionally, and take either answer. */
      function askForUpdate() {
        var sw = navigator.serviceWorker.controller;
        if (!sw || _updatePending) return;
        try {
          var ch = new MessageChannel();
          ch.port1.onmessage = function (ev) {
            if (ev.data && ev.data.type === 'shell-updated') _updatePending = true;
          };
          sw.postMessage({ type: 'ask-update' }, [ch.port2]);
        } catch (err) { /* no controller yet — the next ask covers it */ }
      }
      setTimeout(askForUpdate, 3000);
      setInterval(askForUpdate, 60000);
      setInterval(function () {
        if (!_updatePending || _reloaded) return;
        if (document.hidden) return;                       // not while they are away
        if (Date.now() - _lastTouch < 15000) return;       // still using it
        try { if (window.userIsEditing && userIsEditing()) return; } catch (err) { return; }
        _reloaded = true;
        location.reload();
      }, 5000);
    }
  </script>
</body>
</html>
