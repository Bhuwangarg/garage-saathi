<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Garage Saathi</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Leaflet (live map). Cross-origin → loads when online; map degrades gracefully offline. -->
  <!-- Leaflet is fetched on demand by loadMapLib(), only when a map screen opens.
       It was previously downloaded and parsed on every page load for the large
       majority of sessions that never open a map. -->
  <!-- face-api.js — face detection for attendance check-in/out (fallback when the
       browser has no native FaceDetector). Online only; attendance degrades to a
       plain selfie offline. -->
  <!-- face-api is fetched on demand by loadFaceLib(), only when a face capture
       actually starts, and only where the browser has no native FaceDetector. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <!-- seed-data.js is 541 KB of bundled fleet data used ONLY the first time a
       device is seeded. It was being downloaded, parsed and held in memory on
       every single load, for every device that had long since been seeded.
       loadSeedData() now fetches it only when there is seeding left to do. -->
  <script src="db.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // When a new worker takes control, reload once so the fresh app + data apply
      // without the user having to clear anything.
      let _reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_reloaded) return; _reloaded = true; location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          reg.update();                              // force an update check on every open
          setInterval(() => reg.update(), 3600000);  // and hourly while open
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
